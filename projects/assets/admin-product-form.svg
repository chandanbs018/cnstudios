<svg width="460" height="320" viewBox="0 0 460 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="460" height="320" rx="18" fill="#141110" stroke="#2a2523" stroke-width="1"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="460" height="40" rx="18 18 0 0" fill="#191513" stroke="#2a2523" stroke-width="1"/>
  <text x="20" y="25" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="700" fill="#f3ece5">ADD / EDIT PRODUCT FORM</text>
  <rect x="330" y="8" width="110" height="24" rx="12" fill="linear-gradient(135deg, #5ef1ff, #9b7bff)"/>
  <text x="348" y="24" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="700" fill="#0a0908">Publish Live &#10003;</text>

  <!-- Form Fields Layout -->
  <g transform="translate(20, 52)">
    <!-- Field 1: Title -->
    <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#928a84">PRODUCT TITLE</text>
    <rect x="0" y="18" width="250" height="28" rx="6" fill="#0e0c0b" stroke="#2a2523" stroke-width="1"/>
    <text x="10" y="36" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#f3ece5">Artisanal Tea &amp; Wellness Box</text>

    <!-- Field 2: Category -->
    <text x="265" y="12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#928a84">CATEGORY</text>
    <rect x="265" y="18" width="155" height="28" rx="6" fill="#0e0c0b" stroke="#2a2523" stroke-width="1"/>
    <text x="275" y="36" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#5ef1ff">Executive Suites &#9662;</text>

    <!-- Field 3: Description -->
    <text x="0" y="64" font-family="'JetBrains Mono', monospace" font-size="9" fill="#928a84">HAMPER SPECIFICATIONS &amp; CONTENTS</text>
    <rect x="0" y="70" width="420" height="46" rx="6" fill="#0e0c0b" stroke="#2a2523" stroke-width="1"/>
    <text x="10" y="88" font-family="'Space Grotesk', sans-serif" font-size="10.5" fill="#b5aca6">Includes custom ceramic mug, organic whole-leaf tea tins &amp; soy candle.</text>
    <text x="10" y="104" font-family="'Space Grotesk', sans-serif" font-size="10.5" fill="#b5aca6">Gold foil logo customization available on lid.</text>

    <!-- Field 4: Bulk MOQ & Price Tier -->
    <text x="0" y="132" font-family="'JetBrains Mono', monospace" font-size="9" fill="#928a84">MINIMUM ORDER QTY (MOQ)</text>
    <rect x="0" y="138" width="195" height="28" rx="6" fill="#0e0c0b" stroke="#2a2523" stroke-width="1"/>
    <text x="10" y="156" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ea767d">25 Units</text>

    <!-- Image Upload Area -->
    <text x="210" y="132" font-family="'JetBrains Mono', monospace" font-size="9" fill="#928a84">HIGH-RES ASSET UPLOAD</text>
    <rect x="210" y="138" width="210" height="74" rx="6" fill="#0e0c0b" stroke="#2a2523" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="315" cy="165" r="12" fill="rgba(94,241,255,0.1)"/>
    <text x="310" y="170" font-size="14" fill="#5ef1ff">&#8682;</text>
    <text x="315" y="196" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#928a84" text-anchor="middle">hamper_wellness_hires.webp (Loaded)</text>

    <!-- Status Toggle -->
    <text x="0" y="184" font-family="'JetBrains Mono', monospace" font-size="9" fill="#928a84">VISIBILITY STATE</text>
    <rect x="0" y="190" width="195" height="24" rx="6" fill="#171412"/>
    <circle cx="15" cy="202" r="4" fill="#54c46f"/>
    <text x="26" y="206" font-family="'JetBrains Mono', monospace" font-size="9" fill="#54c46f">PUBLISHED ON LIVE SITE</text>
